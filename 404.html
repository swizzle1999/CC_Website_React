<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages serves this file for any unmatched route.
      // Detect the base path dynamically (e.g. /CC_Website_React/) from the
      // first URL segment, then redirect to the SPA root with the route encoded
      // as a query param so index.html can restore it via history.replaceState.
      var base = '/' + window.location.pathname.split('/')[1] + '/';
      var route = window.location.pathname.slice(base.length) + window.location.search;
      window.location.replace(base + '?p=' + encodeURIComponent(route) + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
